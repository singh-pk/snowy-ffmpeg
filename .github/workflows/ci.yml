name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  repo:
    name: workflows, shell, Dockerfile, spelling, licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: shellcheck@0.11.0,shfmt@3.14.1,typos@1.51.1,zizmor@1.31.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: hadolint
        run: docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:v2.15.1 hadolint --config packages/ffmpeg/.hadolint.yaml packages/ffmpeg/Dockerfile
      - run: shellcheck packages/ffmpeg/build/*.sh .githooks/*
      - run: shfmt --diff packages/ffmpeg/build .githooks
      - run: typos
      - run: zizmor --offline --min-severity=low .github
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Pull requests that leave packages/ffmpeg alone skip its 2-minute build; pushes to main
  # always build it, which also keeps the build cache warm for pull requests.
  changes:
    name: changed packages
    runs-on: ubuntu-latest
    outputs:
      ffmpeg: ${{ steps.diff.outputs.ffmpeg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A file counts for a package if it is in the package or outside packages/ (lockfile,
      # shared configuration, workflows). Markdown never changes a build.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] || git diff --name-only "$BASE" HEAD \
            | awk '!/\.md$/ && (!/^packages\// || /^packages\/ffmpeg\//) { found = 1 } END { exit !found }'; then
            echo ffmpeg=true >> "$GITHUB_OUTPUT"
          else
            echo ffmpeg=false >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ffmpeg build and test
    needs: changes
    if: needs.changes.outputs.ffmpeg == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/ffmpeg
          target: dist
          outputs: type=local,dest=packages/ffmpeg/dist
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Reproducible build
        run: sha256sum -c dist.sha256
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun scripts/gen-dts.ts
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun test

  # The one check the main ruleset requires, so adding, renaming or skipping a job never
  # needs a ruleset change. Skipped jobs pass; failed or cancelled ones do not.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, repo, changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case $result in
              success | skipped) ;;
              *) echo "::error::a required job ended with $result" && exit 1 ;;
            esac
          done
