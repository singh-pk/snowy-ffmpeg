name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  repo:
    name: workflows, shell, Dockerfile, spelling, licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: shellcheck@0.11.0,shfmt@3.14.1,typos@1.51.1,zizmor@1.31.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: hadolint
        run: docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:v2.15.1 hadolint --config packages/ffmpeg/.hadolint.yaml packages/ffmpeg/Dockerfile
      - run: shellcheck packages/ffmpeg/build/*.sh .githooks/*
      - run: shfmt --diff packages/ffmpeg/build .githooks
      - run: typos
      - run: zizmor --offline --min-severity=low .github
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  build:
    name: build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/ffmpeg
          target: dist
          outputs: type=local,dest=packages/ffmpeg/dist
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Reproducible build
        run: sha256sum -c dist.sha256
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun scripts/gen-dts.ts
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun test
