#
# Pull requests are squash-merged, so the title becomes the commit message on main and
# must follow Conventional Commits (CONTRIBUTING.md#commits).
name: pr

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|test|docs|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z].{1,70}[^.]$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::'$TITLE' is not a Conventional Commit title, e.g. 'fix(core): keep pts when seeking raw H.264'"
            exit 1
          fi

  # feat, fix and perf change what users get, so they need a CHANGELOG.md entry. The
  # no-changelog label skips the check for changes nobody outside the repository notices.
  changelog:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'no-changelog')
      && (startsWith(github.event.pull_request.title, 'feat')
      || startsWith(github.event.pull_request.title, 'fix')
      || startsWith(github.event.pull_request.title, 'perf'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check CHANGELOG.md is updated
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! gh pr diff "$PR" -R "$REPO" --name-only | grep -qx CHANGELOG.md; then
            echo "::error::Add a line to CHANGELOG.md under Unreleased, or label the pull request no-changelog."
            exit 1
          fi
