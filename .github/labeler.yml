# Labels pull requests by the files they change (.github/workflows/labeler.yml). Every label
# here is defined in settings.yml.
"package:engine":
  - changed-files:
      - any-glob-to-any-file: packages/engine/**
"package:ffmpeg":
  - changed-files:
      - any-glob-to-any-file: packages/ffmpeg/**
"package:sync":
  - changed-files:
      - any-glob-to-any-file: packages/sync/**
"package:timeline":
  - changed-files:
      - any-glob-to-any-file: packages/timeline/**
"area:ci":
  - changed-files:
      - any-glob-to-any-file: [.github/**, .githooks/**, scripts/**, tooling/**]
"area:docs":
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", "packages/*/docs/**"]
